name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m ruff check main.py biobeat run_demo.py tests scripts
      - run: python -m compileall -q main.py biobeat run_demo.py scripts tests
      - run: bash -n build_app.sh run_demo.command
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Qt display dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          xvfb xauth libegl1 libgl1 libxkbcommon-x11-0 libxcb-xinerama0
          libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1
          libxcb-render-util0 libxcb-xkb1 libnss3 libasound2t64
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify Qt platform plugin dependencies
        run: |
          python - <<'PYQT'
          from pathlib import Path
          import subprocess
          from PyQt5.QtCore import QLibraryInfo
          plugin = Path(QLibraryInfo.location(QLibraryInfo.PluginsPath)) / 'platforms/libqxcb.so'
          result = subprocess.run(['ldd', str(plugin)], capture_output=True, text=True, check=True)
          missing = [line for line in result.stdout.splitlines() if 'not found' in line]
          print('Missing Qt platform libraries:', missing)
          assert not missing, 'Install the missing system libraries before starting Qt.'
          PYQT
      - name: Run Qt regression tests in a virtual display
        env:
          RUN_GUI_TESTS: '1'
          QTWEBENGINE_DISABLE_SANDBOX: '1'
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: xvfb-run -a python -m pytest -q -s tests/test_gui.py
